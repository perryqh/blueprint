name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # rustfmt and clippy come from rust-toolchain.toml, which also pins the
    # version — so a formatting or lint disagreement here means the code
    # changed, not that the runner shipped a different toolchain than you have.
    # `--workspace` everywhere: the anchoring crate is a workspace member, and
    # without the flag cargo touches only the root package — so the crate holding
    # the algorithm would go unlinted and untested while CI stayed green.
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    # Catches the tail of the `plan-share` → `blueprint` rename that the compiler
    # can't see: string literals in URLs, env-var names, help text, comments,
    # docs, and frontend JS.
    #
    # This was a `#[test]` that walked the working tree on every `cargo test` —
    # a lint in a test's clothing, whose runtime scaled with whatever happened to
    # be sitting in the checkout and which could fail on an untracked local file.
    # `git grep` only looks at tracked content, so it needs no skip-list for
    # `target/` or `node_modules/`, and it costs a CI second instead of a
    # tree-walk per test run.
    #
    # Cargo.lock is excluded because transitive dependency names legitimately
    # contain these substrings.
    - name: No stale plan-share references
      run: |
        if git grep -In -e 'plan-share' -e 'plan_share' -e 'PLAN_SHARE' \
             -- '*.rs' '*.toml' '*.md' '*.js' '*.html' '*.css' '*.json' \
             ':!Cargo.lock' ':!frontend/pkg'; then
          echo "::error::stale plan-share reference(s) above — drop or rename"
          exit 1
        fi

  # The DOM half of anchoring is still JavaScript, so it needs its own runner.
  # Split from the Rust job so a JS failure is legible at a glance. Runs against
  # the committed wasm artifact — the same one the daemon serves.
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install
      run: npm ci
    - name: Test
      run: npx vitest run

  # `frontend/pkg/` is a build output that has to be committed, because
  # `rust-embed` reads `frontend/` at compile time and therefore needs the wasm
  # to already exist — otherwise a plain `cargo install --path .` yields a daemon
  # that 404s its own anchoring module.
  #
  # The hazard that creates: edit `anchor/src/`, forget to rebuild, and every
  # other check still passes. The Rust tests exercise the crate source, the JS
  # tests exercise the stale artifact, and production serves the stale one.
  #
  # Comparing bytes against a fresh build does NOT work — wasm codegen is not
  # reproducible across platforms, so an ubuntu runner and a macOS laptop emit
  # functionally identical modules with different bytes. (Measured, not assumed:
  # the first run of this job failed on exactly that, and only on the `.wasm` —
  # wasm-bindgen's JS glue *was* byte-identical.)
  #
  # So: byte-compare the glue, which is deterministic and moves whenever the
  # exported API does, and compare the `.wasm` behaviourally against a fresh
  # build over a corpus. That is immune to codegen noise and still catches an
  # artifact whose behaviour has drifted from the source beside it.
  wasm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install wasm-pack
      run: cargo install wasm-pack --version 0.15.0 --locked
    # Into a scratch dir, so the committed artifact survives for comparison.
    - name: Build a fresh artifact from source
      run: |
        wasm-pack build anchor --target web --out-dir /tmp/pkg-fresh \
          --out-name anchor --no-typescript --no-pack --release -- --features wasm
    - name: Glue matches its source
      run: |
        if ! diff -u frontend/pkg/anchor.js /tmp/pkg-fresh/anchor.js; then
          echo "::error::frontend/pkg/anchor.js is stale — rebuild it (see README) and commit the result"
          exit 1
        fi
    - name: Committed wasm behaves identically to a fresh build
      run: node scripts/check-wasm-parity.mjs frontend/pkg /tmp/pkg-fresh
