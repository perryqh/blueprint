name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # rustfmt and clippy come from rust-toolchain.toml, which also pins the
    # version — so a formatting or lint disagreement here means the code
    # changed, not that the runner shipped a different toolchain than you have.
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # The anchoring algorithm lives in JavaScript, so it needs its own runner.
  # Split from the Rust job so a JS failure is legible at a glance.
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install
      run: npm ci
    - name: Test
      run: npx vitest run
