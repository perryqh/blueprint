[package]
name = "blueprint"
version = "0.1.0"
edition = "2024"
description = "Share interactive HTML blueprints with inline anchored comments"

# The anchoring algorithm lives in its own member crate because it is the one
# piece of the daemon that also has to compile to wasm32 for the browser, and
# this package cannot: rusqlite, tokio and axum have no wasm target.
[workspace]
members = ["anchor"]

[dependencies]
blueprint-anchor = { path = "anchor" }
axum = { version = "0.7", features = ["macros"] }
# Named rather than "full": these are the features actually reachable from the
# code, so the list doubles as documentation of what the daemon uses.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-std",
  "io-util",
  "time",
  "sync",
  "signal",
] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["debug-embed"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
tower-sessions = "0.13"
async-trait = "0.1"
# `signal` + `process` for the daemon's SIGTERM/reap path, replacing a
# hand-declared `extern "C" { fn kill }`.
nix = { version = "0.29", features = ["fs", "signal", "process"] }
# Non-poisoning mutex. A panic mid-query leaves the SQLite Connection perfectly
# usable, so std's poison flag turns a recoverable blip into a permanently
# bricked daemon — and its `lock()` returns a Result nobody can act on.
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
rusty-hook = "0.11"
# Only the integration tests drive a browser-shaped client with a cookie jar.
reqwest = { version = "0.12", features = ["json", "cookies"] }

[profile.release]
lto = "thin"
strip = true
